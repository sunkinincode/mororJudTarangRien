<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Card Subtle Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#042f2e" flood-opacity="0.25"/>
    </filter>

    <filter id="blockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    
    <filter id="cursorShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Calendar Page Base -->
  <g filter="url(#dropShadow)">
    <rect x="76" y="86" width="360" height="340" rx="36" fill="#ffffff"/>
    
    <!-- Calendar Top Bar -->
    <path d="M 76 122 C 76 102 92 86 112 86 L 400 86 C 420 86 436 102 436 122 L 436 156 L 76 156 Z" fill="#14b8a6"/>
    
    <!-- Binder Rings -->
    <rect x="144" y="66" width="24" height="42" rx="12" fill="#042f2e" opacity="0.85"/>
    <rect x="244" y="66" width="24" height="42" rx="12" fill="#042f2e" opacity="0.85"/>
    <rect x="344" y="66" width="24" height="42" rx="12" fill="#042f2e" opacity="0.85"/>

    <!-- Subtle Grid Lines -->
    <line x1="76" y1="216" x2="436" y2="216" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="76" y1="280" x2="436" y2="280" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="76" y1="344" x2="436" y2="344" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="186" y1="156" x2="186" y2="426" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="306" y1="156" x2="306" y2="426" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Course Blocks on Grid -->
    <!-- Block 1: Morning Cobalt (Monday) -->
    <rect x="96" y="172" width="76" height="92" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <rect x="108" y="186" width="44" height="8" rx="4" fill="#1e40af"/>
    <rect x="108" y="202" width="52" height="6" rx="3" fill="#60a5fa"/>
    <rect x="108" y="238" width="34" height="12" rx="4" fill="#ffffff" opacity="0.9"/>

    <!-- Block 2: Afternoon Rose (Tuesday) -->
    <rect x="198" y="236" width="94" height="92" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="3"/>
    <rect x="212" y="250" width="56" height="8" rx="4" fill="#9f1239"/>
    <rect x="212" y="266" width="66" height="6" rx="3" fill="#fb7185"/>
    <rect x="212" y="302" width="40" height="12" rx="4" fill="#ffffff" opacity="0.9"/>

    <!-- Block 3: Snapping / Dragged Amber Block with Lift Shadow -->
    <g filter="url(#blockShadow)" transform="translate(18, -12)">
      <rect x="290" y="296" width="98" height="96" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3.5"/>
      <rect x="304" y="312" width="60" height="8" rx="4" fill="#92400e"/>
      <rect x="304" y="328" width="70" height="6" rx="3" fill="#f59e0b"/>
      <rect x="304" y="362" width="44" height="14" rx="4" fill="#ffffff" opacity="0.95"/>
    </g>

    <!-- Sleek Interactive Mouse Cursor Dragging the Block -->
    <g filter="url(#cursorShadow)" transform="translate(372, 334)">
      <path d="M 0 0 L 0 32 L 8.5 24.5 L 18 40 L 25 36 L 15.5 20.5 L 26 20 Z" fill="#0f172a" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
